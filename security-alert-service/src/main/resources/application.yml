server:
  port: 8083

spring:
  application:
    name: SECURITY-ALERT-SERVICE
  datasource:
    url: jdbc:h2:mem:securitydb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:3000/eureka/}
  instance:
    prefer-ip-address: true
